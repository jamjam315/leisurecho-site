<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 旧プライバシーポリシーURL（2026-07-18制定版）。現行版は /privacy/ に移動した。
     GitHub Pagesは静的ホスティングで301を返せないため、meta refresh + canonical +
     JSのreplaceで転送する。このURLはストア等に登録済みの可能性があるため、
     ファイルごと消さずに転送で生かしておく。 -->
<meta http-equiv="refresh" content="0; url=privacy/">
<link rel="canonical" href="https://leisurecho.com/privacy/">
<meta name="robots" content="noindex">
<title>プライバシーポリシー | レジャー帳</title>
<style>
  :root {
    --green: #4C9A72;
    --green-dark: #04342C;
    --text: #22302B;
    --text-sub: #5B6B64;
    --bg: #FAFCFB;
    --line: #E2EAE6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.9;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .app-name {
    font-size: 14px;
    color: var(--green);
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--green-dark);
    margin-top: 6px;
  }
  p {
    color: var(--text-sub);
    margin-top: 16px;
    font-size: 15px;
  }
  .links {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 15px;
  }
  a { color: var(--green); }
</style>
<script>location.replace('privacy/');</script>
</head>
<body>
  <div class="card">
    <div class="app-name">レジャー帳</div>
    <h1>プライバシーポリシー</h1>
    <p>このページは移動しました。自動で移動しない場合は、下のリンクからお進みください。</p>
    <div class="links">
      <a href="privacy/">プライバシーポリシーを見る</a>
    </div>
  </div>
</body>
</html>
